<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRC Kmart Public Dashboard</title>
    <meta
      name="description"
      content="A Public dashboard with statistics about the VRC Kmart maps and applications"
    />
    <meta name="og:title" content="VRC Kmart Public Dashboard" />
    <meta
      name="og:description"
      content="A Public dashboard with statistics about the VRC Kmart maps and applications"
    />

    <script src="./assets/dashboard.js" defer></script>
    <link rel="stylesheet" href="./assets/style.css" />

    <!-- Imports (not tariffed) -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </head>
  <body lang="en" data-bs-theme="dark">
    <nav class="navbar bg-body-tertiary">
      <div class="container text-center" id="theFuckingNavbar">
        <a class="navbar-brand" href="#">
          <img
            src="./assets/logoVertical.png"
            alt="VRC Kmart Logo"
            width="69"
            height="58"
          />
          Dashboard
        </a>
      </div>
    </nav>
    <div class="container" id="mainDiv">
      <br />
      <!-- Current Player Counts -->
      <div class="row" id="playerCounts">
        <div class="card col-4">
          <div class="card-body">
            <svg id="superK-players" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 77.13 77.13">
              <defs>
                <style>
                  .cls-1 {
                    opacity: 0.0;
                  }
                  .cls-3 {
                    opacity: 0.25;
                  }
                </style>
              </defs>
              <title>Asset 7</title>

              <g id="Layer_2" data-name="Layer 2">
                <g id="Layer_6" data-name="Layer 6">
                  <clipPath id="cut-off-bottom">
                    <circle class="cls-1" cx="38.56" cy="38.56" r="38.56"/>
                  </clipPath>
                  <circle class="cls-3" cx="38.56" cy="38.56" r="38.56"/>
                  <image id="skText" x="35%" y="18%" style="width:24px;height:24px;" href="./assets/na.svg" clip-path="url(#cut-off-bottom)"/>
                  <text id="superK-players-text" class="regular-text" x="50%" y="75%" text-anchor="middle" style="font-size: 24px !important;" fill="#ffffff">NA</text>
                  <path id="superK-players-color" class="cls-2" d="M18,59.45a29.34,29.34,0,1,1,41.26,0h0l5.62,4.75a36.68,36.68,0,1,0-52.32.24Z"/>
                </g>
              </g>
            </svg>
            <span>Player Count in SuperK</span>
          </div>
        </div>
        <div class="card col-4">
          <div class="card-body">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <span>Player Count in Main Store</span>
          </div>
        </div>
        <div class="card col-4">
          <div class="card-body">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <span>Player Count in Express</span>
          </div>
        </div>
      </div>
      <br />

      <!-- Total Visits -->
      <div class="row" id="playerVisits">
        <div class="card col-4">
          <div class="card-body">
            <div class="progress" role="progressbar" aria-label="Success example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="1000000">
              <div class="progress-bar bg-danger" style="width: 25%" id="totVisitSuperK"></div>
            </div>
            <span>Total Visits to SuperK</span>
          </div>
        </div>
        <div class="card col-4">
          <div class="card-body">
            <div class="progress" role="progressbar" aria-label="Success example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="1000000">
              <div class="progress-bar bg-danger" style="width: 25%" id="totVisitMain"></div>
            </div>
            <span>Total Visits to Main Store</span>
          </div>
        </div>
        <div class="card col-4">
          <div class="card-body">
            <div class="progress" role="progressbar" aria-label="Success example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="1000000">
              <div class="progress-bar bg-danger" style="width: 25%" id="totVisitExpress"></div>
            </div>
            <span>Total Visits to Express</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
